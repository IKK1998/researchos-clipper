name: Lua tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 tests/logic.lua
      - run: lua5.4 tests/client.lua
      - run: lua5.4 tests/capture.lua
      - run: lua5.4 tests/title_flow.lua
      - run: lua5.4 tests/titles.lua
      - run: luac5.4 -p ResearchClipper.spoon/init.lua
      - run: luac5.4 -p ResearchClipper.spoon/titles.lua
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-extension-acceptance
          path: artifacts/browser-runtime/
